name: Deploy to GitHub Pages
# [배포 1] main push 또는 Actions 화면의 수동 실행이 시작 조건입니다.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    # [배포 2] 아래 steps는 GitHub runner에서 위에서 아래로 실행됩니다.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # lock 파일의 버전으로 설치합니다. setup-node 자체는 앱 패키지를 설치하지 않습니다.
      - run: npm ci
      - uses: actions/configure-pages@v6
        id: pages
      # [배포 3] 소스를 브라우저용 파일로 변환해 dist 폴더에 만듭니다.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      # [배포 4] dist를 전달한 뒤 Pages가 공개 URL에 게시합니다.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
